<h2>Invitar usuario</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Correo</label>
  <input formControlName="email" />
  <p class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
    Escribe un correo válido.
  </p>

  <label>Rol</label>
  <select formControlName="rolAcceso">
    <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
  </select>

  <p class="error">{{ message() }}</p>

  <button type="submit">Enviar invitación</button>
</form>

<div *ngIf="invitacion()">
  <p>Invitación creada. Pásale este enlace a la persona invitada:</p>
  <p>http://localhost:4200/invitaciones/{{ invitacion()?.token }}/aceptar</p>
  <p>Vence: {{ invitacion()?.fechaExpiracion }}</p>
</div>
