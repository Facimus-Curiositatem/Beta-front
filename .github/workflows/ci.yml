# CI/CD del front (Beta-front)
#
#   Pull request a main  -> CI: pruebas unitarias (Karma) + build + imagen :pr-N
#                           + pruebas E2E (Selenium) contra un backend temporal en beta-back
#   Merge (push) a main  -> las mismas pruebas, imagen :latest y :sha-xxxxxxx, y despliegue en
#                           beta-front cuando pasan, despues de la aprobacion en "production"
#   Manual (Actions)     -> las mismas pruebas sobre la rama elegida, imagen :sha-xxxxxxx, sin desplegar
name: CI/CD Front

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# En un PR, un push nuevo cancela la ejecucion anterior. El evento va en el grupo para que
# una ejecucion manual sobre main no cancele un merge que espera turno para desplegar.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGEN: ghcr.io/facimus-curiositatem/beta-front
  TS_FRONT: beta-front
  TS_BACK: beta-back

jobs:
  # ---------------------------------------------------------------- CI
  test:
    name: Pruebas unitarias (Karma)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas con cobertura
        run: >
          npx ng test --watch=false --browsers=ChromeHeadlessCI
          --code-coverage --reporters=progress --reporters=junit

      - name: Reporte de pruebas unitarias
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Reporte Karma
          path: reportes/junit/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-front
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Imagen Docker (GHCR)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tags.outputs.principal }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular etiquetas
        id: tags
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA_TAG="sha-$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)"
            echo "principal=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "todas=pr-${{ github.event.pull_request.number }} $SHA_TAG" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "principal=$SHA_TAG" >> "$GITHUB_OUTPUT"
            echo "todas=$SHA_TAG latest" >> "$GITHUB_OUTPUT"
          else
            # Ejecucion manual: :latest queda solo para lo que llega a main por merge
            echo "principal=$SHA_TAG" >> "$GITHUB_OUTPUT"
            echo "todas=$SHA_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build de la imagen
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t beta-front:ci .

      # La imagen arranca y nginx sirve el index y el /healthz
      - name: Smoke test de la imagen
        run: |
          docker run -d --name front-ci -p 8080:8080 beta-front:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/healthz > /dev/null && break
            sleep 2
          done
          curl -fs http://localhost:8080/healthz
          curl -fs http://localhost:8080/ | grep -qi '<app-root' && echo "index.html OK"
          # Una ruta de Angular debe devolver el index (no 404)
          curl -fs -o /dev/null http://localhost:8080/login && echo "Rutas de Angular OK"
          docker rm -f front-ci

      - name: Publicar en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for TAG in ${{ steps.tags.outputs.todas }}; do
            docker tag beta-front:ci "$IMAGEN:$TAG"
            docker push -q "$IMAGEN:$TAG"
            echo "- \`$IMAGEN:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # Selenium en el PR, en el merge y en las ejecuciones manuales: la imagen recien publicada
  # corre en el runner y usa un backend temporal en beta-back (imagen beta-back:latest,
  # BD vacia proyecto_ci_front). Si falla una prueba, el PR queda en rojo y no se despliega.
  e2e:
    name: Pruebas E2E (Selenium)
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
      packages: read   # imagen del front en el runner y del backend en la VM
    # Una sola ejecucion a la vez usa el backend temporal y la BD proyecto_ci_front
    concurrency:
      group: e2e-beta-front
      cancel-in-progress: false
    env:
      BACK_IMAGEN: ghcr.io/facimus-curiositatem/beta-back:latest
      FRONT_IMAGEN: ghcr.io/facimus-curiositatem/beta-front:${{ needs.docker.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Conectar a Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar SSH a beta-back
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BACK_KNOWN_HOSTS }}
        run: bash ci/preparar-ssh.sh "$TS_BACK"

      - name: Levantar backend temporal
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::El secreto DB_PASSWORD esta vacio. Crealo en Beta-front > Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          # Credenciales temporales en la VM (las borra bajar-backend-e2e.sh)
          ssh servidor 'install -d -m 700 ~/ci'
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$DB_PASSWORD" "$(openssl rand -hex 32)" \
            | ssh servidor 'umask 077; cat > ~/ci/beta-back-ci-front.env'
          echo "$GHCR_TOKEN" | ssh servidor "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          # La imagen se expande en el runner a proposito (SC2029)
          # shellcheck disable=SC2029
          SALIDA=$(ssh servidor "bash -s -- '$BACK_IMAGEN'" < ci/levantar-backend-e2e.sh)
          echo "$SALIDA"
          PUERTO=$(echo "$SALIDA" | sed -n 's/^PUERTO=//p' | tail -n1)
          [ -n "$PUERTO" ] || { echo "No se obtuvo el puerto"; exit 1; }
          echo "BACKEND_URL=http://$SERVIDOR_IP:$PUERTO" >> "$GITHUB_ENV"

      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 60); do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' "$BACKEND_URL/api/v1/procesos" || true)
            # 401/403 = la app ya responde (la ruta exige token)
            if [ "$CODIGO" = "401" ] || [ "$CODIGO" = "403" ]; then
              echo "Backend listo en $BACKEND_URL (HTTP $CODIGO)"
              exit 0
            fi
            echo "Intento $i: HTTP $CODIGO"
            sleep 5
          done
          echo "El backend temporal no arranco a tiempo"
          ssh servidor 'docker logs --tail 80 beta-back-ci-front'
          exit 1

      - name: Levantar el front del PR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name front-e2e --network host -e BACKEND_URL="$BACKEND_URL" "$FRONT_IMAGEN"
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/healthz > /dev/null && { echo "Front listo"; exit 0; }
            echo "Intento $i: el front aun no responde"
            sleep 2
          done
          echo "El front no arranco a tiempo"
          docker logs front-e2e
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Instalar dependencias de las pruebas
        run: pip install -r e2e/requirements.txt pytest-html

      # Sin -l, --showlocals ni --tb=long: mostrarian credenciales de la empresa de prueba
      - name: Pruebas E2E
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_HEADLESS: '1'
          E2E_TIMEOUT: '20'
        run: >
          python -m pytest e2e -v
          --junitxml=e2e/reportes/junit.xml
          --html=e2e/reportes/reporte.html --self-contained-html

      - name: Reporte E2E (tabla de checks)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Reporte E2E Selenium
          path: e2e/reportes/junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Resumen en la pagina de la ejecucion
        if: always()
        run: |
          {
            echo "## Pruebas E2E (Selenium)"
            echo ""
            echo "Front: \`$FRONT_IMAGEN\` · Backend: \`$BACK_IMAGEN\` · BD: \`proyecto_ci_front\`"
            echo ""
            python3 ci/resumen_e2e.py e2e/reportes/junit.xml
          } >> "$GITHUB_STEP_SUMMARY"

      # Pase lo que pase: logs, se quita el backend temporal y se vacia proyecto_ci_front
      - name: Limpiar backend temporal y BD de pruebas
        if: always()
        run: |
          mkdir -p e2e/reportes/logs
          docker logs front-e2e > e2e/reportes/logs/front-e2e.log 2>&1 || true
          docker rm -f front-e2e > /dev/null 2>&1 || true
          docker logout ghcr.io > /dev/null 2>&1 || true
          if [ -f ~/.ssh/config ]; then
            ssh servidor 'bash -s' < ci/bajar-backend-e2e.sh || true
            ssh servidor 'cat ~/ci/beta-back-ci-front.log 2>/dev/null' > e2e/reportes/logs/beta-back-ci-front.log || true
          fi

      - name: Guardar reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: e2e/reportes/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------- CD
  deploy:
    name: Desplegar en beta-front
    runs-on: ubuntu-latest
    # Solo se despliega una imagen que ya paso las pruebas E2E
    needs: [docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-beta-front
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Conectar a Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar SSH a beta-front
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FRONT_KNOWN_HOSTS }}
        run: bash ci/preparar-ssh.sh "$TS_FRONT"

      - name: Comprobar el servidor
        run: |
          ssh servidor 'bash -s' <<'EOF'
          set -e
          test -f /opt/beta/.env || { echo "Falta /opt/beta/.env (ver deploy/.env.example)"; exit 1; }
          if ss -ltnH '( sport = :8080 )' | grep -q . && \
             ! docker ps --format '{{.Names}}' | grep -qx beta-front; then
            echo "El puerto 8080 lo usa otro proceso. Detenlo antes de desplegar."
            ss -ltn
            exit 1
          fi
          EOF

      - name: Desplegar
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.docker.outputs.tag }}
        run: |
          scp deploy/compose.yml servidor:/opt/beta/compose.yml
          echo "$GHCR_TOKEN" | ssh servidor "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh servidor "cd /opt/beta && \
            (grep -q '^FRONT_TAG=' .env && sed -i 's/^FRONT_TAG=.*/FRONT_TAG=$TAG/' .env || echo 'FRONT_TAG=$TAG' >> .env) && \
            docker compose pull && \
            docker compose up -d --wait --wait-timeout 120; \
            RES=\$?; docker logout ghcr.io > /dev/null; docker compose ps; \
            [ \$RES -eq 0 ] || docker compose logs --tail 60 front; exit \$RES"
          ssh servidor 'docker image prune -f > /dev/null'
          echo "Desplegado \`$IMAGEN:$TAG\` en beta-front" >> "$GITHUB_STEP_SUMMARY"

      # Recorrido completo por Internet: Funnel -> nginx -> backend
      - name: Verificar por la URL publica
        if: vars.PUBLIC_URL != ''
        run: |
          URL="${{ vars.PUBLIC_URL }}"
          for i in $(seq 1 24); do
            FRONT=$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz" || true)
            API=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/v1/procesos" || true)
            if [ "$FRONT" = "200" ] && { [ "$API" = "401" ] || [ "$API" = "403" ]; }; then
              echo "App publica OK: front $FRONT, API $API"
              echo "App publicada en $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $i: front $FRONT, API $API"
            sleep 5
          done
          echo "La app no respondio por $URL"
          exit 1
